<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Election Candidate Portal</title>

<style>
body { font-family: Arial; background:#f4f6f8; margin:0; }
header { background:#0d6efd; color:white; padding:20px; text-align:center; }
.container { max-width:1000px; margin:auto; background:white; padding:20px; margin-top:20px; border-radius:8px; }
select, input { width:100%; padding:10px; margin-bottom:10px; }
.candidate { border-bottom:1px solid #eee; padding:15px 0; }
img { width:80px; height:80px; object-fit:cover; margin-right:10px; border-radius:5px; }
button { margin:3px; padding:6px 10px; background:#0d6efd; color:white; border:none; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>

<header>
<h2>নির্বাচনী প্রার্থী তথ্য পোর্টাল</h2>
</header>

<div class="container">

<input id="search" placeholder="Search candidate...">

<select id="division"><option value="">All Divisions</option></select>
<select id="district"><option value="">All Districts</option></select>
<select id="constituency"><option value="">All Constituencies</option></select>

<div id="results"></div>

</div>

<script>
let data=[];

fetch("candidates.json")
.then(r=>r.json())
.then(j=>{
    data=j;
    initFilters();
    render();
});

const divEl=document.getElementById("division");
const distEl=document.getElementById("district");
const consEl=document.getElementById("constituency");
const searchEl=document.getElementById("search");

function unique(field, filter={}){
    return [...new Set(
        data.filter(c=>
            (!filter.division||c.division===filter.division) &&
            (!filter.district||c.district===filter.district)
        ).map(c=>c[field])
    )];
}

function initFilters(){
    unique("division").forEach(d=>{
        divEl.innerHTML+=`<option>${d}</option>`;
    });
}

divEl.onchange=()=>{
    distEl.innerHTML='<option value="">All Districts</option>';
    unique("district",{division:divEl.value}).forEach(d=>{
        distEl.innerHTML+=`<option>${d}</option>`;
    });
    render();
};

distEl.onchange=()=>{
    consEl.innerHTML='<option value="">All Constituencies</option>';
    unique("constituency",{division:divEl.value,district:distEl.value}).forEach(c=>{
        consEl.innerHTML+=`<option>${c}</option>`;
    });
    render();
};

consEl.onchange=render;
searchEl.oninput=render;

function render(){
    const out=document.getElementById("results");
    out.innerHTML="";

    data.filter(c=>
        (!divEl.value||c.division===divEl.value) &&
        (!distEl.value||c.district===distEl.value) &&
        (!consEl.value||c.constituency===consEl.value) &&
        c.name.toLowerCase().includes(searchEl.value.toLowerCase())
    ).forEach(c=>{
        let base=c.path;
        out.innerHTML+=`
        <div class="candidate">
            <strong>${c.name}</strong><br>
            ${c.division} → ${c.district} → ${c.constituency}<br>

            <img src="${base}image.png" onerror="this.style.display='none'">

            <div>
                <a href="${base}1হলফনামা.pdf" target="_blank"><button>হলফনামা</button></a>
                <a href="${base}2নির্বাচনী ব্যয় ও ব্যক্তিগত সম্পদের বিবরণী.pdf" target="_blank"><button>ব্যয় ও সম্পদ</button></a>
                <a href="${base}3আয়কর রিটার্ন.pdf" target="_blank"><button>আয়কর</button></a>
            </div>
        </div>
        `;
    });
}
</script>

</body>
</html>
